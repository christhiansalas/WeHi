[package]
name = "imgcore"
version = "0.1.0"
edition = "2021"
description = "Motor de procesamiento de imágenes de WeHi"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
fast_image_resize = { version = "5", features = ["image"] }
rawler = "0.7"
webp = "0.3"
ab_glyph = "0.2"
ts-rs = { version = "10", features = ["serde-compat"] }

[dev-dependencies]
serde_json = "1"
