name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Linux build deps (Tauri 2)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file \
            wget

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  bundle:
    name: Tauri bundle (${{ matrix.os }})
    needs: [rust, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux build deps (Tauri 2)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file \
            wget

      - run: npm ci

      - name: Build Tauri bundle
        run: npm run tauri:build
        env:
          # Solo se usan en el runner de macOS — Tauri ignora estos
          # vars en Linux/Windows. Si los secrets no están seteados,
          # las vars quedan vacías y se construye sin firmar (igual
          # que antes).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarizar y staple del .dmg
        # Tauri notariza el .app pero deja el .dmg sin staple — sin
        # esto, macOS sigue mostrando "Unnotarized" al verificar el
        # disco de instalación. Submit + staple del .dmg cierran el
        # círculo. Solo corre si los secrets están seteados.
        if: matrix.os == 'macos-latest' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          DMG=$(find target/release/bundle/dmg -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "no se encontró el .dmg"; exit 1; }
          echo "→ Sometiendo $DMG a Apple notarytool..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "→ Adjuntando ticket al .dmg..."
          xcrun stapler staple "$DMG"
          echo "→ Verificando..."
          xcrun stapler validate "$DMG"
          spctl --assess --type install -vvv "$DMG" || true

      - name: Upload bundle (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wehi-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload bundle (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wehi-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload bundle (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: wehi-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifact tree
        run: find artifacts -type f -not -name '*.app' | sort

      - name: Renombrar a nombres estables
        # Los assets se renombran a WeHi_<OS>.<ext> para que las URLs
        # /releases/latest/download/ sigan funcionando entre versiones
        # sin tener que actualizar la web cada vez.
        run: |
          set -eux
          mkdir -p release
          cp artifacts/wehi-macos/dmg/*.dmg          release/WeHi_macOS.dmg
          cp artifacts/wehi-windows/nsis/*.exe       release/WeHi_Windows.exe
          cp artifacts/wehi-windows/msi/*.msi        release/WeHi_Windows.msi
          cp artifacts/wehi-linux/deb/*.deb          release/WeHi_Linux.deb
          cp artifacts/wehi-linux/appimage/*.AppImage release/WeHi_Linux.AppImage
          ls -lh release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
